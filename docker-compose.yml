services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: kiqro
      POSTGRES_PASSWORD: kiqro_dev
      POSTGRES_DB: kiqro
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kiqro -d kiqro"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  pgdata:

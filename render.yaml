# Render Blueprint — Kiqro Network STAGING (Frankfurt).
# Render → New → Blueprint → select this repository. Values marked `sync: false` are asked for
# in the Render dashboard and never stored in git. Setup steps: docs/test-ortami-kurulumu.md
#
# Public hostnames go through Cloudflare (proxied DNS records). Single-level subdomains only:
# Cloudflare's free certificate does not cover names like track.staging.kiqro.com.

databases:
  - name: kiqro-staging-db
    region: frankfurt
    plan: basic-256mb
    databaseName: kiqro
    user: kiqro
    postgresMajorVersion: "17"
    # No public access; services reach it over Render's private network.
    ipAllowList: []

envVarGroups:
  - name: kiqro-staging
    envVars:
      - key: NODE_ENV
        value: production
      - key: TRACKING_BASE_URL
        value: https://track-staging.kiqro.com
      - key: ADVERTISE_BASE_URL
        value: https://advertise-staging.kiqro.com
      - key: ADMIN_BASE_URL
        value: https://admin-staging.kiqro.com
      - key: MAIL_FROM
        value: no-reply@kiqro.com
      - key: MAIL_FROM_NAME
        value: Kiqro Network (staging)
      - key: MAIL_REPLY_TO
        value: ads@kiqro.com
      - key: LEADS_NOTIFY_EMAIL
        value: ads@kiqro.com
      - key: REVIEW_NOTIFY_EMAIL
        value: ads@kiqro.com
      - key: TERMS_REQUIRED
        value: "false"
      # Secrets — entered in the Render dashboard.
      - key: SENDGRID_API_KEY
        sync: false
      - key: SENDGRID_SANDBOX
        value: "true" # staging validates mail without delivering until you switch it off
      - key: IPQS_API_KEY
        sync: false
      # Shared with Cloudflare (Transform Rule adds it as X-Origin-Auth); generated by Render.
      - key: ORIGIN_SECRET
        generateValue: true

services:
  - type: web
    name: kiqro-staging-track
    runtime: docker
    region: frankfurt
    plan: starter
    branch: main
    dockerfilePath: ./infra/docker/node.Dockerfile
    dockerContext: .
    dockerCommand: node_modules/.bin/tsx apps/tracking/src/main.ts
    # Runs before each deploy goes live; a failed migration stops the deploy.
    preDeployCommand: node_modules/.bin/tsx packages/db/src/migrate.ts
    healthCheckPath: /health
    autoDeployTrigger: checksPass
    domains:
      - track-staging.kiqro.com
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: kiqro-staging-db
          property: connectionString
      - fromGroup: kiqro-staging

  - type: worker
    name: kiqro-staging-worker
    runtime: docker
    region: frankfurt
    plan: starter
    branch: main
    dockerfilePath: ./infra/docker/node.Dockerfile
    dockerContext: .
    dockerCommand: node_modules/.bin/tsx apps/tracking/src/worker.ts
    autoDeployTrigger: checksPass
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: kiqro-staging-db
          property: connectionString
      - fromGroup: kiqro-staging

  - type: web
    name: kiqro-staging-advertise
    runtime: docker
    region: frankfurt
    plan: starter
    branch: main
    dockerfilePath: ./infra/docker/next.Dockerfile
    dockerContext: .
    healthCheckPath: /en
    autoDeployTrigger: checksPass
    domains:
      - advertise-staging.kiqro.com
    envVars:
      # Render passes environment variables to the Docker build as build arguments.
      - key: APP
        value: advertise
      - key: DATABASE_URL
        fromDatabase:
          name: kiqro-staging-db
          property: connectionString
      - fromGroup: kiqro-staging

  - type: web
    name: kiqro-staging-admin
    runtime: docker
    region: frankfurt
    plan: starter
    branch: main
    dockerfilePath: ./infra/docker/next.Dockerfile
    dockerContext: .
    healthCheckPath: /login
    autoDeployTrigger: checksPass
    domains:
      - admin-staging.kiqro.com
    envVars:
      - key: APP
        value: admin
      - key: DATABASE_URL
        fromDatabase:
          name: kiqro-staging-db
          property: connectionString
      - fromGroup: kiqro-staging
